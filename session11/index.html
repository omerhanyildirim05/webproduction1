<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Organize  your Games!</title>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="styles.css" />
		<script src="script.js" defer></script>
	</head>

	<body>
		<div id="page">

		    <h1>My Game Collection</h1>

				<!-- Left game selection -->
				<div id="left-container" class="container">

				    <div class="game-holder">
				        <img class="game" id="animal"
				        src="./images/covers/Animal_Crossing.jpg"
				        data-spine="./images/spines/Animal_Crossing_spine.jpg"
				        alt="Animal Crossing">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="botw"
				        src="./images/covers/BOTW.jpg"
				        data-spine="./images/spines/BOTW_spine.jpg"
				        alt="Breath of the Wild">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="cyberpunk"
				        src="./images/covers/cyberpunk_2077.jpg"
				        data-spine="./images/spines/cyberpunk_2077_spine_only.jpg"
				        alt="Cyberpunk 2077">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="detroit"
				        src="./images/covers/Detroit.jpg"
				        data-spine="./images/spines/Detroit_spine.jpg"
				        alt="Detroit Become Human">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="elden"
				        src="./images/covers/elden_ring.jpg"
				        data-spine="./images/spines/elden_ring_spine_only.jpg"
				        alt="Elden Ring">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="gta"
				        src="./images/covers/GTA.jpg"
				        data-spine="./images/spines/GTA_spine.jpg"
				        alt="Grand Theft Auto">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="halo5"
				        src="./images/covers/Halo5.jpg"
				        data-spine="./images/spines/Halo5_spine.jpg"
				        alt="Halo 5">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="injustice"
				        src="./images/covers/Injustice2.jpg"
				        data-spine="./images/spines/Injustice2_spine.jpg"
				        alt="Injustice 2">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="mario"
				        src="./images/covers/Mario_Odyssey.jpg"
				        data-spine="./images/spines/Mario_Odyssey_spine.jpg"
				        alt="Super Mario Odyssey">
				    </div>

				</div>


				<!-- Right game selection -->
				<div id="right-container" class="container">

				    <div class="game-holder">
				        <img class="game" id="mouse"
				        src="./images/covers/Mouse_PI.jpg"
				        data-spine="./images/spines/Mouse_PI_spine.jpg"
				        alt="Mouse PI">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="nier"
				        src="./images/covers/nier_automata.jpg"
				        data-spine="./images/spines/nier_automata_spine_only.png"
				        alt="NieR Automata">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="rdr2"
				        src="./images/covers/RDR2.jpg"
				        data-spine="./images/spines/RDR2_spine.jpg"
				        alt="Red Dead Redemption 2">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="skyrim"
				        src="./images/covers/Skyrim.png"
				        data-spine="./images/spines/Skyrim_spine.jpg"
				        alt="Skyrim">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="smash"
				        src="./images/covers/SSBU.png"
				        data-spine="./images/spines/SSBU_spine.jpg"

				    <div class="game-holder">
				        <img class="game" id="stellar"
				        src="./images/covers/stellar_blade.jpg"

				    </div>

				    <div class="game-holder">
				        <img class="game" id="tlou"
				        src="./images/covers/TLOU.jpg"
				        data-spine="./images/spines/TLOU_spine.jpg"
				        alt="The Last of Us">
				    </div>

				    <div class="game-holder">
				        <img class="game" id="totk"
				        src="./images/covers/TOTK.jpg"
				        data-spine="./images/spines/TOTK_spine.jpg"
				        alt="Tears of the Kingdom">

				    <div class="game-holder">
				        <img class="game" id="undertale"
				        src="./images/covers/Undertale.jpg"
				        data-spine="./images/spines/Undertale_spine.jpg"
				        alt="Undertale">
				    </div>

				</div>


		    <!-- Bookshelf -->
		    <div id="bookshelf">

		        <div class="shelf">
		        </div>

		        <div class="shelf">
		        </div>

		    </div>

		</div>
	</body>
</html>
